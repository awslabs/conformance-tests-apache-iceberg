[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iceberg-conformance"
version = "0.1.0"
description = "Apache Iceberg Table Fuzzer for testing compaction, compression, encoding, and cross-engine compatibility"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Amazon Web Services"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "pyspark==3.5.3",
    "pyiceberg>=0.5.0",
    "polars>=0.20.0",
    "pyarrow>=23.0.1",
    "pyyaml>=6.0",
    "boto3>=1.35.0",
    "sqlalchemy>=1.4.0",
    "duckdb>=1.5.1",
    # DuckDB imports pytz at runtime to handle timestamptz (tz-aware) values;
    # the complex-type read-back tests exercise that path, so declare it
    # explicitly rather than relying on it arriving transitively.
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[project.scripts]
iceberg-conformance = "iceberg_conformance.cli:main"

[project.urls]
Homepage = "https://github.com/awslabs/apache-iceberg-table-fuzzer"
Repository = "https://github.com/awslabs/apache-iceberg-table-fuzzer"
