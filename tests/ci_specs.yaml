# Minimal table specifications for CI/CD testing
# This file contains a small subset of tables for fast CI validation

simple_tables:
  # Basic data types with fast compression
  - unpart_boolean_snappy_plain_v2
  - unpart_int_snappy_plain_v2  
  - unpart_string_snappy_plain_v2
  - unpart_double_snappy_plain_v2
  - unpart_timestamp_snappy_plain_v2

write_pattern_tables:
  # Simple write patterns for CI testing
  - unpart_insert_heavy_zstd_plain_dictionary_v2_cow
  - unpart_batch_replace_zstd_plain_dictionary_v2_cow

# Configuration for CI testing
test_config:
  max_tables_per_backend: 5
  timeout_minutes: 20
  backends_to_test:
    - pyiceberg
    - polars
