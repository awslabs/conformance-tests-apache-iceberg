# Table generation matrix
# Total tables = base_types × compression_configs × encoding_types × iceberg_versions
# Base types: 20 primitives + 20 lists + 20 maps + 20 structs = 80
# Compression configs: gzip(3) + zstd(3) + snappy(1) + lz4(1) = 8
# Encoding types: 2 (PLAIN, RLE - Spark-supported only)
# Iceberg versions: 2
# Total: 80 × 8 × 2 × 2 = 2,560 tables
# = 80 × 9 × 8 × 2 = 11,520 tables
table_count:
  basic_primitive_types: 12
  string_variants: 4
  binary_variants: 4
  total_primitive_types: 20
  complex_list_types: 20
  complex_map_types: 20
  complex_struct_types: 20
  total_base_types: 80
  compression_codecs: 2
  compression_levels_per_codec: 5
  total_compression_configs: 10
  encoding_variants: 8
  iceberg_versions: 2
  total_tables: 12800

# Write Pattern Tables - Comprehensive multi-column tables for compaction testing
write_patterns:
  metadata:
    description: "Comprehensive multi-column tables with different write patterns for compaction testing"
    total_columns: 24
    final_rows: 1000
    deterministic_data: true
    
  # Schema definition for all write-pattern tables
  schema:
    - name: id
      type: int
      description: "Primary key, sequential integers 1-1000"
      
    # 20 primitive type columns
    - name: boolean_col
      type: boolean
    - name: int_col
      type: int
    - name: long_col
      type: long
    - name: float_col
      type: float
    - name: double_col
      type: double
    - name: string_col
      type: string
    - name: binary_col
      type: binary
    - name: date_col
      type: date
    - name: time_col
      type: time
    - name: timestamp_col
      type: timestamp
    - name: timestamptz_col
      type: timestamptz
    - name: decimal_col
      type: decimal(10,2)
    - name: uuid_col
      type: uuid
    - name: fixed_col
      type: fixed(16)
    - name: string_small_col
      type: string
    - name: string_medium_col
      type: string
    - name: string_long_col
      type: string
    - name: binary_small_col
      type: binary
    - name: binary_medium_col
      type: binary
    - name: binary_long_col
      type: binary
      
    # 3 list type columns (simplified from planned 20)
    - name: list_boolean_col
      type: list<boolean>
    - name: list_int_col
      type: list<int>
    - name: list_string_col
      type: list<string>
  
  # Write patterns for different compaction scenarios
  patterns:
    - name: insert_heavy
      description: "Append-only growth pattern"
      use_case: "Log/event data, time-series"
      commits: 10
      operations: "INSERT 100 rows per commit"
      pyiceberg_status: "fully_supported"
      
    - name: update_heavy
      description: "In-place modifications pattern"
      use_case: "Customer records, inventory updates"
      commits: 10
      operations: "INSERT 1000 rows, then UPDATE different blocks"
      pyiceberg_status: "limited"
      limitation: "No direct UPDATE operations"
      
    - name: delete_heavy
      description: "Data purging pattern"
      use_case: "GDPR compliance, data retention"
      commits: 15
      operations: "INSERT 2000 rows, then DELETE 1000 rows"
      pyiceberg_status: "limited"
      limitation: "No direct DELETE operations"
      
    - name: mixed_chaos
      description: "Real-world simulation pattern"
      use_case: "OLTP workload"
      commits: 20
      operations: "Random mix of INSERT/UPDATE/DELETE"
      pyiceberg_status: "limited"
      limitation: "No mixed operations support"
      
    - name: batch_replace
      description: "ETL-style pattern"
      use_case: "Daily batch processing"
      commits: 12
      operations: "Alternating INSERT new batch, DELETE old batch"
      pyiceberg_status: "fully_supported"
      implementation: "Uses table.overwrite() operations"
      
    - name: gradual_growth
      description: "Steady state pattern"
      use_case: "User growth with churn"
      commits: 10
      operations: "Each commit: +150 INSERT, -50 DELETE"
      pyiceberg_status: "fully_supported"
      implementation: "Incremental inserts"
      
    - name: burst_ops
      description: "Peak load pattern"
      use_case: "Black Friday, viral content"
      commits: 7
      operations: "Small commits, then massive burst, then cleanup"
      pyiceberg_status: "fully_supported"
      implementation: "Burst + overwrite pattern"
      
    - name: truncate_cycles
      description: "Complete refresh pattern"
      use_case: "Data refresh, testing resets"
      commits: 20
      operations: "Multiple truncate and regrow cycles"
      pyiceberg_status: "limited"
      limitation: "No TRUNCATE operations"
      
  # Configuration for write-pattern tables
  table_config:
    compression: "zstd"
    encoding: "plain_dictionary"
    versions: ["v1", "v2"]
    delete_modes: ["cow", "posdelete"]
    total_tables: 32  # 8 patterns × 2 versions × 2 delete modes

# Partitioned Tables - Comprehensive partition testing
partitioned_tables:
  metadata:
    description: "Partitioned tables with various partition transforms for compaction testing"
    total_columns: 30  # 7 partition fields + 20 primitive + 3 list
    final_rows: 100000
    deterministic_data: true
    versions: ["v2"]  # Only v2 format
    delete_modes: ["cow", "posdelete"]  # No eqdelete
    
  # Schema definition for all partitioned tables (extends write-pattern schema)
  schema:
    - name: id
      type: int
      description: "Primary key, sequential integers 1-10000"
    - name: category
      type: string
      description: "Categorical field with 5 values: A, B, C, D, E (2000 rows each)"
    - name: name
      type: string
      description: "String field for truncate transforms: name_1 to name_10000"
    - name: value
      type: int
      description: "Numeric field for bucket transforms: 1-10000"
    - name: timestamp
      type: timestamp
      description: "Temporal field spanning 2020-2024 for temporal transforms"
    - name: deprecated_field
      type: string
      description: "Always NULL for void transform testing"
    - name: single_value_field
      type: string
      description: "Always 'CONSTANT' for single-partition testing"
    # All 20 primitive columns from write-patterns
    - name: boolean_col
      type: boolean
    - name: int_col
      type: int
    - name: long_col
      type: long
    - name: float_col
      type: float
    - name: double_col
      type: double
    - name: string_col
      type: string
    - name: binary_col
      type: binary
    - name: date_col
      type: date
    - name: time_col
      type: time
    - name: timestamp_col
      type: timestamp
    - name: timestamptz_col
      type: timestamptz
    - name: decimal_col
      type: decimal(10,2)
    - name: uuid_col
      type: uuid
    - name: fixed_col
      type: fixed(16)
    - name: string_small_col
      type: string
    - name: string_medium_col
      type: string
    - name: string_long_col
      type: string
    - name: binary_small_col
      type: binary
    - name: binary_medium_col
      type: binary
    - name: binary_long_col
      type: binary
    # 3 list columns
    - name: list_boolean_col
      type: list<boolean>
    - name: list_int_col
      type: list<int>
    - name: list_string_col
      type: list<string>
  
  # Partition transform specifications
  partition_transforms:
    # Single-column transforms (10)
    - name: identity_category
      spec: "identity(category)"
      description: "Direct categorical partitioning (5 partitions)"
      
    - name: bucket4_id
      spec: "bucket[4](id)"
      description: "Hash partition into 4 buckets"
      
    - name: bucket8_id
      spec: "bucket[8](id)"
      description: "Hash partition into 8 buckets"
      
    - name: truncate2_name
      spec: "truncate[2](name)"
      description: "Truncate string to 2 characters"
      
    - name: truncate5_name
      spec: "truncate[5](name)"
      description: "Truncate string to 5 characters"
      
    - name: year_timestamp
      spec: "year(timestamp)"
      description: "Partition by year (5 years: 2020-2024)"
      
    - name: month_timestamp
      spec: "month(timestamp)"
      description: "Partition by month"
      
    - name: day_timestamp
      spec: "day(timestamp)"
      description: "Partition by day"
      
    - name: hour_timestamp
      spec: "hour(timestamp)"
      description: "Partition by hour"
      
    - name: bucket10_value
      spec: "bucket[10](value)"
      description: "Numeric bucketing into 10 buckets"
    
    # Multi-column transforms (5)
    - name: identity_category__year_timestamp
      spec: "identity(category), year(timestamp)"
      description: "Categorical + temporal (2-way partition)"
      
    - name: identity_category__bucket8_id
      spec: "identity(category), bucket[8](id)"
      description: "Categorical + hash (2-way partition)"
      
    - name: bucket4_id__day_timestamp
      spec: "bucket[4](id), day(timestamp)"
      description: "Hash + temporal (2-way partition)"
      
    - name: year_timestamp__bucket4_id
      spec: "year(timestamp), bucket[4](id)"
      description: "Temporal + hash, different order (2-way partition)"
      
    - name: identity_category__month_timestamp__bucket4_id
      spec: "identity(category), month(timestamp), bucket[4](id)"
      description: "Three-way partition"
    
    # Edge case transforms (1)
    # Note: void transform not supported in Spark 3.4 / Iceberg 1.4.2
    # - name: void_deprecated
    #   spec: "void(deprecated_field)"
    #   description: "Hidden partition (single partition)"
      
    - name: identity_single
      spec: "identity(single_value_field)"
      description: "Single partition (constant value)"
  
  # Write patterns (same as unpartitioned)
  patterns:
    - insert_heavy
    - update_heavy
    - delete_heavy
    - mixed_chaos
    - batch_replace
    - gradual_growth
    - burst_ops
    - truncate_cycles
  
  # Table count calculation
  table_count:
    partition_transforms: 16  # Removed void (unsupported in Spark 3.4)
    write_patterns: 8
    versions: 1  # v2 only
    delete_modes: 2  # cow, posdelete
    total_tables: 256  # 16 × 8 × 1 × 2 = 256

# Naming convention for generated tables
naming_convention:
  unpartitioned_pattern: "unpart_{datatype}_{codec}_lvl{level}_{encoding}"
  partitioned_pattern: "part_{transform_spec}_{pattern}_{delete_mode}_{path_style}"
  description: "Tables prefixed with 'unpart' for unpartitioned, 'part' for partitioned"
  examples:
    unpartitioned:
      - "v1.unpart_int_gzip_lvl1_plain"
      - "v1.unpart_string_small_zstd_lvl3_dictionary"
      - "v1.unpart_long_gzip_lvl2_delta_binary_packed"
      - "v2.unpart_float_zstd_lvl4_byte_stream_split"
    partitioned:
      - "part_identity_category_insert_heavy_cow_hive"
      - "part_bucket4_id_delete_heavy_posdelete_nonhive"
      - "part_identity_category__year_timestamp_mixed_chaos_cow_hive"
      - "part_void_deprecated_gradual_growth_posdelete_nonhive"
  namespace_organization:
    - "v1 namespace: Iceberg format version 1 tables (unpartitioned only)"
    - "v2 namespace: Iceberg format version 2 tables (unpartitioned + partitioned)"
  write_pattern_tables:
    unpartitioned: "unpart_{pattern_name}_zstd_plain_dictionary_{version}_{delete_mode}"
    partitioned: "part_{transform_spec}_{pattern}_{delete_mode}_{path_style}"
    examples:
      - "unpart_insert_heavy_zstd_plain_dictionary_v1_cow"
      - "part_month_timestamp_batch_replace_cow_hive"
