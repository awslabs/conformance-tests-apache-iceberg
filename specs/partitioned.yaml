# Partitioned Tables - Multi-column tables with partition transforms for compaction testing

metadata:
  description: "Partitioned tables with different write patterns for compaction testing"
  total_columns: 30
  final_rows: 100000  # 10 batches × 10K rows each
  deterministic_data: true

# Configuration for partitioned tables
table_config:
  compression: "snappy"
  encoding: "plain"
  versions: ["v1", "v2"]
  delete_modes: ["cow", "posdelete"]

  # Version-specific constraints
  v1_supported_modes: ["cow"]  # v1 only supports copy-on-write
  v2_supported_modes: ["cow", "posdelete"]  # v2 supports both

# Naming convention
naming_convention:
  pattern: "part_{transform_spec}_{pattern}_{delete_mode}"
  examples:
    - "part_identity_category_insert_heavy_cow"
    - "part_bucket4_id_delete_heavy_posdelete"
    - "part_identity_category_year_timestamp_mixed_chaos_cow"
