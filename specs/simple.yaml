# Table count calculation
table_count:
  basic_primitive_types: 12
  string_variants: 4
  binary_variants: 4
  total_primitive_types: 20
  complex_list_types: 20
  complex_map_types: 20
  complex_struct_types: 20
  total_base_types: 80
  compression_codecs: 2
  compression_levels_per_codec: 5
  total_compression_configs: 10
  encoding_variants: 8
  iceberg_versions: 2
  total_tables: 12800

# Naming convention
naming_convention:
  pattern: "unpart_{datatype}_{codec}_lvl{level}_{encoding}"
  examples:
    - "unpart_int_gzip_lvl1_plain"
    - "unpart_string_small_zstd_lvl3_dictionary"
