name: Apache Iceberg Table Fuzzer Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-table-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Test iceberg_fuzzer imports
      run: |
        python -c "import iceberg_fuzzer; print('iceberg_fuzzer imported successfully')"
        python -m iceberg_fuzzer.cli --help
    
    - name: Generate 3 random simple tables with PyIceberg
      run: |
        python -m iceberg_fuzzer.cli generate --backend pyiceberg --warehouse-path ./test-warehouse-pyiceberg --specs specs/simple.yaml --random 3
    
    - name: Generate 3 random simple tables with Polars
      run: |
        python -m iceberg_fuzzer.cli generate --backend polars --warehouse-path ./test-warehouse-polars --specs specs/simple.yaml --random 3
    
    - name: Debug - List created directories
      if: always()
      run: |
        echo "=== PyIceberg warehouse structure ==="
        find ./test-warehouse-pyiceberg -type d 2>/dev/null || echo "No PyIceberg warehouse found"
        echo "=== Polars warehouse structure ==="
        find ./test-warehouse-polars -type d 2>/dev/null || echo "No Polars warehouse found"
    
    - name: Verify PyIceberg tables were created
      run: |
        TABLE_COUNT=$(find ./test-warehouse-pyiceberg -name "metadata" -type d 2>/dev/null | wc -l)
        echo "PyIceberg tables created: $TABLE_COUNT"
        if [ $TABLE_COUNT -lt 2 ]; then
          echo "ERROR: Expected 3 PyIceberg tables, got $TABLE_COUNT"
          exit 1
        else
          echo "✅ Successfully created $TABLE_COUNT PyIceberg tables"
        fi
    
    - name: Verify Polars tables were created
      run: |
        TABLE_COUNT=$(find ./test-warehouse-polars -name "metadata" -type d 2>/dev/null | wc -l)
        echo "Polars tables created: $TABLE_COUNT"
        if [ $TABLE_COUNT -lt 2 ]; then
          echo "ERROR: Expected 3 Polars tables, got $TABLE_COUNT"
          exit 1
        else
          echo "✅ Successfully created $TABLE_COUNT Polars tables"
        fi
    
    - name: Upload PyIceberg test artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-warehouse-pyiceberg
        path: ./test-warehouse-pyiceberg/
        retention-days: 1
    
    - name: Upload Polars test artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-warehouse-polars
        path: ./test-warehouse-polars/
        retention-days: 1
