name: Pre-commit Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: 3.12

jobs:
  cli-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@f06b870e0a91d23284a3013acc55e6f88ab4b904 # v7
    - name: Set up Python 3.9
      run: uv python install 3.9
    - name: Set up Java 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Install dependencies
      run: uv sync
    - name: Test CLI and imports
      run: |
        uv run python -c "import pyspark, pyiceberg, polars, pyarrow, yaml, boto3, sqlalchemy, duckdb; print('All imports successful')"
        uv run python -m iceberg_fuzzer.cli --help

  pyiceberg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: cli-test
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@f06b870e0a91d23284a3013acc55e6f88ab4b904 # v7
    - name: Set up Python 3.9
      run: uv python install 3.9
    - name: Install dependencies
      run: uv sync
    - name: Generate PyIceberg tables
      run: uv run python -m iceberg_fuzzer.cli generate --backend pyiceberg --warehouse-path ./test-warehouse-pyiceberg --specs specs/simple.yaml --minimal
    - name: Verify PyIceberg tables
      run: |
        COUNT=$(find ./test-warehouse-pyiceberg -name "metadata" -type d 2>/dev/null | wc -l)
        echo "PyIceberg tables: $COUNT"
        [ $COUNT -eq 34 ] || exit 1
    - name: Upload PyIceberg artifacts
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: pyiceberg-tables
        path: ./test-warehouse-pyiceberg/
        retention-days: 7

  polars:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: cli-test
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@f06b870e0a91d23284a3013acc55e6f88ab4b904 # v7
    - name: Set up Python 3.9
      run: uv python install 3.9
    - name: Install dependencies
      run: uv sync
    - name: Generate Polars tables
      run: uv run python -m iceberg_fuzzer.cli generate --backend polars --warehouse-path ./test-warehouse-polars --specs specs/simple.yaml --minimal
    - name: Verify Polars tables
      run: |
        COUNT=$(find ./test-warehouse-polars -name "metadata" -type d 2>/dev/null | wc -l)
        echo "Polars tables: $COUNT"
        [ $COUNT -eq 34 ] || exit 1
    - name: Upload Polars artifacts
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: polars-tables
        path: ./test-warehouse-polars/
        retention-days: 7

  pyspark-simple:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: cli-test
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@f06b870e0a91d23284a3013acc55e6f88ab4b904 # v7
    - name: Set up Python 3.9
      run: uv python install 3.9
    - name: Set up Java 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Install dependencies
      run: uv sync
    - name: Generate PySpark simple tables
      run: uv run python -m iceberg_fuzzer.cli generate --backend pyspark --warehouse-path $PWD/test-warehouse-pyspark --specs specs/simple.yaml --minimal
    - name: Verify PySpark simple tables
      run: |
        SIMPLE_COUNT=$(find ./test-warehouse-pyspark -name "metadata" -type d 2>/dev/null | wc -l)
        echo "PySpark simple: $SIMPLE_COUNT"
        [ $SIMPLE_COUNT -eq 34 ] || exit 1
    - name: Upload PySpark simple artifacts
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: pyspark-simple-tables
        path: ./test-warehouse-pyspark/
        retention-days: 7

  pyspark-partitioned:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: cli-test
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@f06b870e0a91d23284a3013acc55e6f88ab4b904 # v7
    - name: Set up Python 3.9
      run: uv python install 3.9
    - name: Set up Java 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Install dependencies
      run: uv sync
    - name: Generate PySpark partitioned tables
      run: uv run python -m iceberg_fuzzer.cli generate --backend pyspark --warehouse-path $PWD/test-warehouse-pyspark-partitioned --specs specs/partitioned.yaml --minimal
    - name: Verify PySpark partitioned tables
      run: |
        PARTITIONED_COUNT=$(find ./test-warehouse-pyspark-partitioned -name "metadata" -type d 2>/dev/null | wc -l)
        echo "PySpark partitioned: $PARTITIONED_COUNT"
        [ $PARTITIONED_COUNT -eq 8 ] || exit 1
    - name: Upload PySpark partitioned artifacts
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: pyspark-partitioned-tables
        path: ./test-warehouse-pyspark-partitioned/
        retention-days: 7

  pyspark-writepatterns:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: cli-test
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@f06b870e0a91d23284a3013acc55e6f88ab4b904 # v7
    - name: Set up Python 3.9
      run: uv python install 3.9
    - name: Set up Java 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Install dependencies
      run: uv sync
    - name: Generate PySpark write-pattern tables
      run: uv run python -m iceberg_fuzzer.cli generate --backend pyspark --warehouse-path $PWD/test-warehouse-pyspark-writepatterns --specs specs/write_patterns.yaml --random 3
    - name: Verify PySpark write-pattern tables
      run: |
        WRITEPATTERNS_COUNT=$(find ./test-warehouse-pyspark-writepatterns -name "metadata" -type d 2>/dev/null | wc -l)
        echo "PySpark write-patterns: $WRITEPATTERNS_COUNT"
        [ $WRITEPATTERNS_COUNT -eq 3 ] || exit 1
    - name: Upload PySpark write-pattern artifacts
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: pyspark-writepattern-tables
        path: ./test-warehouse-pyspark-writepatterns/
        retention-days: 7

  pyspark-evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: cli-test
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@f06b870e0a91d23284a3013acc55e6f88ab4b904 # v7
    - name: Set up Python 3.9
      run: uv python install 3.9
    - name: Set up Java 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Install dependencies
      run: uv sync
    - name: Generate PySpark evolution tables
      run: uv run python -m iceberg_fuzzer.cli generate --backend pyspark --warehouse-path $PWD/test-warehouse-pyspark-evolution --specs specs/evolution.yaml --random 3
    - name: Verify PySpark evolution tables
      run: |
        EVOLUTION_COUNT=$(find ./test-warehouse-pyspark-evolution -name "metadata" -type d 2>/dev/null | wc -l)
        echo "PySpark evolution: $EVOLUTION_COUNT"
        [ $EVOLUTION_COUNT -eq 3 ] || exit 1
    - name: Upload PySpark evolution artifacts
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: pyspark-evolution-tables
        path: ./test-warehouse-pyspark-evolution/
        retention-days: 7

  workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: cli-test
    strategy:
      matrix:
        workflow-file:
          - specs/workflows/compaction.yaml
          - specs/workflows/rollback.yaml
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@f06b870e0a91d23284a3013acc55e6f88ab4b904 # v7
    - name: Set up Python 3.9
      run: uv python install 3.9
    - name: Set up Java 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Install dependencies
      run: uv sync
    - name: Generate a table
      run: uv run python -m iceberg_fuzzer.cli generate --backend pyspark --warehouse-path $PWD/test-warehouse-workflow --specs specs/simple.yaml --minimal --table-name unpart_int_none_plain_v2
    - name: Run workflow
      run: |
        uv run python -m iceberg_fuzzer.cli workflow run \
          --workflow ${{ matrix.workflow-file }} \
          --warehouse-path $PWD/test-warehouse-workflow \
          --table-name unpart_int_none_plain_v2 \
          --namespace simple

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@f06b870e0a91d23284a3013acc55e6f88ab4b904 # v7
    - name: Set up Python
      run: uv python install ${{ env.PYTHON_VERSION }}
    - name: Install dependencies
      run: uv sync --extra dev
    - name: Run PyTest
      run: uv run pytest

  validation-complete:
    name: "Validation Workflow Complete"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - cli-test
      - pyiceberg
      - polars
      - pyspark-simple
      - pyspark-partitioned
      - pyspark-writepatterns
      - pyspark-evolution
      - workflow
      - pytest
    steps:
      - name: Verify jobs succeeded
        run: echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success")'
