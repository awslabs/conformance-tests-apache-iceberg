version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # CodeQL is broken into multiple actions, however all steps must run the same version.
      # To mitigate, configure Dependabot to aggregate updates to those actions in one PR.
      codeql-action:
        patterns:
          - "github/codeql-action*"
